[package]
name = "niuma-agent-runtime"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Process and terminal runtime management for 牛马Agent"
publish = false

[dependencies]
niuma-contracts = { package = "niuma-agent-contracts", version = "=0.4.49", path = "../niuma-contracts" }
dunce.workspace = true
portable-pty.workspace = true
retach.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
futures-util.workspace = true
tokio-tungstenite.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
filedescriptor = "=0.8.3"

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1.4", features = ["event", "fs", "process"] }
nix.workspace = true
sha2.workspace = true
uuid.workspace = true

[target.'cfg(windows)'.dependencies]
niuma-windows-process = { path = "../niuma-windows-process" }
win32job.workspace = true

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true

[lib]
name = "niuma_runtime"
